<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="900" height="520" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="900" height="520" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e293b">How ctxscope Works</text>

  <!-- Repository box -->
  <rect x="60" y="65" width="220" height="140" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#059669">Your Repository</text>
  <text x="170" y="122" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">AGENTS.md</text>
  <text x="170" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">CLAUDE.md</text>
  <text x="170" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">.cursor/rules/*</text>
  <text x="170" y="176" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">.github/copilot-*.md</text>
  <text x="170" y="194" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">.opencode/skills/**</text>

  <!-- ctxscope engine -->
  <rect x="340" y="55" width="220" height="160" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6366f1">ctxscope Engine</text>
  <rect x="365" y="100" width="170" height="28" rx="6" fill="#e0e7ff"/>
  <text x="450" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca">Scan &amp; Discover</text>
  <rect x="365" y="135" width="170" height="28" rx="6" fill="#e0e7ff"/>
  <text x="450" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca">Validate &amp; Score</text>
  <rect x="365" y="170" width="170" height="28" rx="6" fill="#e0e7ff"/>
  <text x="450" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca">Fix &amp; Optimize</text>

  <!-- Arrow repo -> engine -->
  <line x1="280" y1="135" x2="335" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output boxes -->
  <rect x="620" y="55" width="220" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">Diagnostics Report</text>
  <text x="730" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">2 errors · 3 warnings</text>

  <rect x="620" y="125" width="220" height="55" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="730" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca">Context Score</text>
  <text x="730" y="166" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#4338ca">64/100 → 82/100</text>

  <rect x="620" y="195" width="220" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="730" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857">Token Savings</text>
  <text x="730" y="236" text-anchor="middle" font-family="monospace" font-size="11" fill="#047857">~420 tokens saved per session</text>

  <!-- Arrow engine -> outputs -->
  <line x1="560" y1="115" x2="615" y2="82" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="135" x2="615" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="155" x2="615" y2="222" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: CI integration -->
  <rect x="200" y="280" width="500" height="65" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Pull Request CI Pipeline</text>
  <text x="450" y="327" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">ctxscope doctor --ci  →  blocks PR if errors found</text>

  <!-- Down arrows from outputs to CI -->
  <line x1="660" y1="250" x2="660" y2="277" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="250" x2="730" y2="277" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Git diff box -->
  <rect x="200" y="370" width="500" height="55" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Git-Aware Diffing</text>
  <text x="450" y="413" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">ctxscope doctor --diff main  →  context drift snapshot</text>

  <!-- Arrow CI -> diff -->
  <line x1="450" y1="345" x2="450" y2="367" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="370" width="100" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="75" y="385" width="12" height="12" rx="3" fill="#059669"/>
  <text x="93" y="396" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Repository</text>
  <rect x="75" y="405" width="12" height="12" rx="3" fill="#6366f1"/>
  <text x="93" y="416" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Engine</text>
  <rect x="75" y="425" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="93" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Diagnostics</text>
  <rect x="75" y="445" width="12" height="12" rx="3" fill="#cbd5e1"/>
  <text x="93" y="456" font-family="system-ui, sans-serif" font-size="10" fill="#475569">CI / Git</text>
</svg>
