<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <linearGradient id="gBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="gAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="gAfterBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Before &amp; After ctxscope</text>

  <!-- Before column -->
  <rect x="50" y="55" width="320" height="290" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626">Before ctxscope</text>

  <rect x="75" y="105" width="270" height="40" rx="6" fill="#fee2e2"/>
  <text x="210" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#991b1b">✗ Stale, conflicting instructions</text>
  <text x="210" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">Manual review, no guardrails</text>

  <rect x="75" y="160" width="270" height="40" rx="6" fill="#fee2e2"/>
  <text x="210" y="180" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#991b1b">✗ Broken CI runs</text>
  <text x="210" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">No automated checks</text>

  <rect x="75" y="215" width="270" height="40" rx="6" fill="#fee2e2"/>
  <text x="210" y="235" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#991b1b">✗ Token waste ~9K/session</text>
  <text x="210" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">Duplicates, oversized files</text>

  <rect x="75" y="270" width="270" height="40" rx="6" fill="#fee2e2"/>
  <text x="210" y="290" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#991b1b">✗ Mixed package managers</text>
  <text x="210" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">npm vs pnpm confusion</text>

  <!-- After column -->
  <rect x="430" y="55" width="320" height="290" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">After ctxscope</text>

  <rect x="455" y="105" width="270" height="40" rx="6" fill="#dcfce7"/>
  <text x="590" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#166534">✓ Auto-validated instructions</text>
  <text x="590" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">10 rules catch drift</text>

  <rect x="455" y="160" width="270" height="40" rx="6" fill="#dcfce7"/>
  <text x="590" y="180" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#166534">✓ CI gated on errors</text>
  <text x="590" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">doctor --ci blocks bad PRs</text>

  <rect x="455" y="215" width="270" height="40" rx="6" fill="#dcfce7"/>
  <text x="590" y="235" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#166534">✓ Optimized ~420 tokens saved</text>
  <text x="590" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">Autofix removes waste</text>

  <rect x="455" y="270" width="270" height="40" rx="6" fill="#dcfce7"/>
  <text x="590" y="290" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#166534">✓ Normalized package manager</text>
  <text x="590" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">Auto-detected from lockfile</text>
</svg>
